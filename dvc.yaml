stages:
  train:
    cmd: python training/train.py
    deps:
      - data/raw/breast_cancer.csv
      - training/train.py
      - params.yaml
    params:
      - seed
      - data.test_size
      - cross_validation.folds
      - models.logistic_regression
      - models.random_forest
    outs:
      - artifacts/model.joblib
      - artifacts/model_card.json
    metrics:
      - artifacts/metrics.json:
          cache: false